name: Environment Promotion

on:
  workflow_dispatch:
    inputs:
      from_environment:
        description: Source environment
        required: true
        default: development
        type: choice
        options:
          - development
          - staging
      to_environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      services:
        description: Service set
        required: false
        default: all
        type: string
      bundle_path:
        description: Promotion bundle path from the dispatching Atlas control plane
        required: false
        default: ""
        type: string
      bundle_sha256:
        description: Promotion bundle digest from the dispatching Atlas control plane
        required: false
        default: ""
        type: string

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: ${{ inputs.to_environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Verify release gate
        run: pnpm verify:release

      - name: Generate promotion manifests
        run: pnpm exec tsx ./scripts/promote-release.ts --from ${{ inputs.from_environment }} --to ${{ inputs.to_environment }} --services ${{ inputs.services }}

      - name: Record dispatched bundle metadata
        run: |
          printf 'bundle_path=%s\n' '${{ inputs.bundle_path }}'
          printf 'bundle_sha256=%s\n' '${{ inputs.bundle_sha256 }}'

      - name: Upload promotion manifests
        uses: actions/upload-artifact@v4
        with:
          name: atlas-promotion-manifests-${{ inputs.to_environment }}
          path: release-manifests/${{ inputs.to_environment }}
